version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: flowState_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowState}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowState_backend
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-flowState}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      - db

volumes:
  pgdata:
