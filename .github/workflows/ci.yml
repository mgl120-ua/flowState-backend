name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowstate
          POSTGRES_PASSWORD: flowstate
          POSTGRES_DB: flowstate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowstate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        env:
          FLOWSTATE_TEST_DB_URL: jdbc:postgresql://localhost:5432/flowstate_test
          FLOWSTATE_TEST_DB_USER: flowstate
          FLOWSTATE_TEST_DB_PASSWORD: flowstate
        run: bash ./mvnw -B verify
