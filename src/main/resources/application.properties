spring.application.name=flowstate
server.port=8085

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/flowState
spring.datasource.username=marta
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=03d6a8933b68ff
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Acciones HTTP: por defecto no se permite llamar a direcciones internas (loopback, redes privadas...)
flowstate.http.allow-private-hosts=${FLOWSTATE_HTTP_ALLOW_PRIVATE_HOSTS:false}

# Acciones LLM: ollama (modelo local con https://ollama.com, gratuito) o fake (respuestas fijas, para tests)
flowstate.llm.provider=${FLOWSTATE_LLM_PROVIDER:ollama}
flowstate.llm.ollama-url=${FLOWSTATE_LLM_OLLAMA_URL:http://localhost:11434}
flowstate.llm.default-model=${FLOWSTATE_LLM_DEFAULT_MODEL:qwen2.5:3b}
# Precio en USD por millón de tokens de un modelo de pago, por ejemplo:
# flowstate.llm.prices[nombre-del-modelo].input=0.10
# flowstate.llm.prices[nombre-del-modelo].output=0.50
# Los modelos que no aparecen aquí se consideran locales y cuestan 0

# Spring profile-specific configuration
# Use SPRING_PROFILES_ACTIVE=local or prod
# JWT secret should be provided via environment or profile-specific property
jwt.secret=${JWT_SECRET}
